<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>FROZEN IN FLAMES</title><style>
:root{color-scheme:dark;font:15px system-ui;background:#090b12;color:#e9ecf6}body{margin:0;background:radial-gradient(ellipse at 50% -20%,#27234a,#090b12 60%)}header{padding:28px 4vw;border-bottom:1px solid #30364c;display:flex;justify-content:space-between;align-items:center}h1{letter-spacing:.16em;font-size:clamp(20px,3vw,34px);margin:0}.sub{color:#9da8c4}main{padding:24px 4vw;max-width:1500px;margin:auto}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}.card{background:#121827;border:1px solid #303b56;border-radius:12px;padding:16px}.card h3{margin:0 0 7px}.pill{display:inline-block;border:1px solid #58678c;border-radius:99px;padding:3px 9px;color:#b9c9ff;font-size:12px}.muted{color:#9ba7c1}.status{color:#9df5c0}.tabs{display:flex;flex-wrap:wrap;gap:8px;margin:22px 0}.tabs button{background:#151c2c;color:#dce4ff;border:1px solid #3a4562;padding:9px 13px;border-radius:8px;cursor:pointer}.tabs button:hover{border-color:#9c8aff}.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin:16px 0}.toolbar input{background:#111827;color:white;border:1px solid #3b4765;padding:10px;border-radius:8px;min-width:240px}.error{color:#ff9b9b}.small{font-size:12px}</style></head><body><header><div><h1>FROZEN IN FLAMES</h1><div class="sub">One service. Every platform. Nothing left out.</div></div><div class="pill">LIBRE BUILD · 39 TARGETS</div></header><main><section class="grid" id="summary"><div class="card"><div class="muted">Platform targets</div><h2 id="count">Loading…</h2></div><div class="card"><div class="muted">Service endpoints</div><h2>9</h2><div class="small status" id="health">Checking services…</div></div><div class="card"><div class="muted">Freedom policy</div><h2>F / H</h2><div class="small">Software freedom and hardware freedom evaluated separately</div></div></section><div class="tabs" id="tabs"></div><div class="toolbar"><input id="search" placeholder="Search platforms, roles, categories…"><span class="muted" id="resultCount"></span></div><section class="grid" id="platforms"></section></main><script>
const services=['catalog','provenance','dependency','evidence','policy','profiles','build','ai','workspace'];
const endpoints=services.map((s,i)=>`/api/${s}/health`);let all=[];
async function get(url){const r=await fetch(url);if(!r.ok)throw Error(`${r.status} ${url}`);return r.json()}
async function boot(){let good=0;await Promise.all(endpoints.map(async u=>{try{await get(u);good++}catch{}}));document.querySelector('#health').textContent=`${good}/9 service endpoints responding`;document.querySelector('#health').className=good===9?'small status':'small error';try{const d=await get('/api/catalog/platforms');all=d.platforms;document.querySelector('#count').textContent=d.count;render()}catch(e){document.querySelector('#platforms').innerHTML=`<div class="card error">Catalog unavailable: ${e.message}</div>`}}
function render(){const q=document.querySelector('#search').value.toLowerCase();const cat=window.cat||'All';const items=all.filter(p=>(cat==='All'||p.category===cat)&&`${p.name} ${p.role} ${p.category} ${p.license}`.toLowerCase().includes(q));document.querySelector('#resultCount').textContent=`${items.length} shown`;document.querySelector('#platforms').innerHTML=items.map(p=>`<article class="card"><div class="pill">${p.category}</div><h3>${p.name}</h3><div class="muted">${p.role}</div><p class="small">Mode: ${p.mode}</p><div class="small">License: ${p.license}</div></article>`).join('')||'<div class="card">No matching platforms.</div>'}
const cats=['All','Foundation','Runtimes','Data','Delivery','Web','AI','Media','Editors','Smart Home'];document.querySelector('#tabs').innerHTML=cats.map(c=>`<button data-cat="${c}">${c}</button>`).join('');document.querySelector('#tabs').addEventListener('click',e=>{if(e.target.dataset.cat){window.cat=e.target.dataset.cat;render()}});document.querySelector('#search').addEventListener('input',render);boot();
</script></body></html>
